<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital JS tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Roboto Mono', monospace;
    font-size: 15.3px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: -0.025em;
    color: #000;
    background: #d1d1d1; /* même gris que les outils */
  }
  body { padding: 16px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    border: 1px solid #000;
    background: #fff;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  header h1 { margin: 0; font-size: inherit; font-weight: inherit; }
  header span { color: #777; }

  #tools {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .tool {
    display: flex;
    flex-direction: column;
    border: 1px solid #000;
    background: #fff;
    color: inherit;
    text-decoration: none;
  }
  .tool .thumb {
    aspect-ratio: 210 / 297; /* A4, comme les affiches */
    border-bottom: 1px solid #000;
    background: #fff center / cover no-repeat;
  }
  .tool .info { padding: 10px 12px 12px; }
  .tool .name { display: block; }
  .tool .desc { display: block; margin-top: 6px; color: #777; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .tool:hover { background: #000; color: #fff; }
  .tool:hover .desc { color: #bbb; }
</style>
</head>
<body>

<header>
  <h1>Digital JS tools</h1>
  <span id="count"></span>
</header>

<main id="tools"></main>

<script>
// Pour ajouter un outil : une ligne de plus ici (dossier = nom du dossier dans le dépôt,
// apercu = une image dans le dossier apercu/, facultative).
const TOOLS = [
  {
    dossier: "tools_DA_cercle_001",
    nom: "Cercle de cartes",
    desc: "Affiche Nordway : titre, dégradé et anneau de cartes qui tourne, piloté à la main par la webcam.",
    apercu: "apercu/tools_DA_cercle_001.jpg",
  },
  {
    dossier: "tools_vibe_000",
    nom: "Typo organique",
    desc: "Le texte sert de graine : une matière organique pousse autour des lettres.",
    apercu: "apercu/tools_vibe_000.jpg",
  },
];

const list = document.getElementById("tools");
for (const t of TOOLS) {
  const a = document.createElement("a");
  a.className = "tool";
  a.href = t.dossier + "/";
  a.innerHTML = `
    <div class="thumb"></div>
    <div class="info">
      <span class="name"></span>
      <span class="desc"></span>
    </div>`;
  if (t.apercu) a.querySelector(".thumb").style.backgroundImage = `url("${t.apercu}")`;
  a.querySelector(".name").textContent = t.nom + " · " + t.dossier;
  a.querySelector(".desc").textContent = t.desc;
  list.appendChild(a);
}
document.getElementById("count").textContent = TOOLS.length + " outils";
</script>
</body>
</html>
