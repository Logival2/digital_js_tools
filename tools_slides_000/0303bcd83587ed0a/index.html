<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Projects · Slides + live web</title>
<!-- Page cachée : on y arrive par le code de ../index.html. Choisir un projet, ou en créer un. -->
<!-- interface commune des outils (verre, typo, pilules) : panneau à gauche, projets à droite -->
<link rel="stylesheet" href="../../ui/ui_001.css" />
<script defer src="../../ui/ui_001.js"></script>
<script src="db.js"></script>
<style>
  #panel .section > button { width: 100%; }
  #panel .section > .field + button { margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  #panelFooter { padding: 8px var(--pad) var(--pad); border-top: 1px dashed var(--dash); }

  /* ── Zone principale : les projets, en grille ── */
  #main { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 10px 10px 10px 0; box-sizing: border-box; }
  #list {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, 312px); gap: 22px 10px;
  }
  .proj a { display: block; color: inherit; text-decoration: none; }
  .thumb {
    aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: var(--fs-mono); text-transform: uppercase;
    transition: transform 0.2s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb.dark { background: #000; color: #fff; }
  .proj a:hover .thumb { transform: translateY(-3px); }
  .meta { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .name { font-family: var(--sans); font-size: var(--fs-text); }
  .info { font-family: var(--mono); font-size: var(--fs-mono); opacity: 0.6; }
  .acts { margin-left: auto; display: flex; gap: 10px; font-family: var(--mono); font-size: var(--fs-mono); }
  .acts button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--text); opacity: 0.6; }
  .acts button:hover { opacity: 1; text-decoration: underline; }
  #empty { height: 100%; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  #empty p { margin: 0; }
</style>
</head>
<body data-layout="panels">

<!-- Panneau latéral, comme dans les outils -->
<aside id="panel">
  <header id="panelHead">
    <p class="eyebrow"><a class="badge backLink" href="../../" title="Back to all tools">← Digital tools</a></p>
    <h1 class="toolTitle">Slides<br>+ live web</h1>
  </header>

  <!-- Nouveau projet : un nom, puis Entrée -->
  <form class="section" id="newForm">
    <h2>New project</h2>
    <div class="field">
      <label for="newName">Name</label>
      <input id="newName" type="text" spellcheck="false" placeholder="Course, talk…" />
    </div>
    <button type="submit" class="cta">Create project</button>
    <p class="hint">Each project is kept in this browser, images and videos included. Open one on the right.</p>
  </form>

  <div class="section collapsed">
    <h2>Access</h2>
    <button id="lock" type="button" class="pill">Lock (forget the code here)</button>
  </div>

  <footer id="panelFooter">
    <span id="countLabel" class="mono">No project</span>
  </footer>
</aside>

<!-- Zone principale : les projets -->
<main id="main">
  <div id="empty" hidden><p>Create your first project</p></div>
  <ol id="list"></ol>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const when = (t) => new Date(t).toLocaleDateString([], { day: "numeric", month: "short" });
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ── Une carte de projet : vignette (sa première image), nom, nombre de slides, actions ──
function projCard({ href, name, info, thumb, acts = [] }) {
  const li = document.createElement("li");
  li.className = "proj";
  const a = document.createElement("a");
  a.href = href;
  a.append(thumb);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(Object.assign(document.createElement("span"), { className: "name", textContent: name }),
              Object.assign(document.createElement("span"), { className: "info", textContent: info }));
  const box = document.createElement("span");
  box.className = "acts";
  for (const [txt, fn] of acts) {
    const b = Object.assign(document.createElement("button"), { type: "button", textContent: txt });
    b.onclick = fn;
    box.append(b);
  }
  meta.append(box);
  li.append(a, meta);
  return li;
}
function thumbOf(first, src) {
  const t = document.createElement("div");
  t.className = "thumb";
  if (first && first.type === "img" && src) { const i = new Image(); i.src = src; t.append(i); }
  else { t.classList.add("dark"); t.textContent = first ? (first.type === "video" ? "Video" : first.label || "Live") : "Empty"; }
  return t;
}

async function draw() {
  const items = [];
  // les projets de ce navigateur, le plus récent d'abord
  const projects = (await DB.all().catch(() => [])).sort((a, b) => b.updated - a.updated);
  for (const p of projects) {
    const first = (p.slides || [])[0];
    const src = first && first.blob ? URL.createObjectURL(first.blob) : null;
    const n = (p.slides || []).length;
    items.push(projCard({
      href: `slides.html?p=${encodeURIComponent(p.id)}`,
      name: p.name,
      info: `${pad(n)} slide${n > 1 ? "s" : ""} · ${when(p.updated)}`,
      thumb: thumbOf(first, src),
      acts: [
        ["Rename", async () => { const v = prompt("Project name", p.name); if (v && v.trim()) { p.name = v.trim(); await DB.put(p); draw(); } }],
        ["Delete", async () => { if (confirm(`Delete “${p.name}” and its slides from this browser?`)) { await DB.del(p.id); draw(); } }],
      ],
    }));
  }
  // le deck poussé dans deck/deck.json, s'il existe : visible depuis n'importe quel ordinateur
  try {
    const r = await fetch("deck/deck.json", { cache: "no-store" });
    if (r.ok) {
      const { slides = [] } = await r.json();
      const f = slides[0];
      const first = f && (f.img ? { type: "img" } : f.video ? { type: "video" } : { type: "web", label: f.label });
      items.push(projCard({ href: "slides.html?p=published", name: "Published deck", info: `${pad(slides.length)} slides · online`, thumb: thumbOf(first, f && f.img) }));
    }
  } catch {}
  $("list").replaceChildren(...items);
  $("list").hidden = !items.length;
  $("empty").hidden = items.length > 0;
  $("countLabel").textContent = projects.length ? `${projects.length} project${projects.length > 1 ? "s" : ""}` : "No project";
  if (!projects.length) $("newName").focus();
}

// ── Créer un projet : il s'ouvre aussitôt ──
$("newForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("newName").value.trim();
  if (!name) return $("newName").focus();
  const id = newId();
  await DB.put({ id, name, created: Date.now(), updated: Date.now(), slides: [], aside: [], notes: {} });
  location.href = `slides.html?p=${id}`;
});

// ── Une seule fois : les sites et notes gardés par l'ancienne version deviennent le projet « My deck » ──
async function migrate() {
  if (localStorage.getItem("slides.migrated")) return;
  localStorage.setItem("slides.migrated", "1");
  let webs = [], notes = {};
  try { webs = JSON.parse(localStorage.getItem("slides.web.v1") || "[]"); } catch {}
  try { notes = JSON.parse(localStorage.getItem("slides.notes.v1") || "{}"); } catch {}
  if (!webs.length) return;
  const it = (s) => ({ type: "web", url: s.url, label: s.label });
  await DB.put({ id: newId(), name: "My deck", created: Date.now(), updated: Date.now(),
    slides: webs.filter((s) => !s.aside).map(it), aside: webs.filter((s) => s.aside).map(it), notes });
}

$("lock").onclick = () => { try { localStorage.removeItem("slides.key"); } catch {} location.href = "../"; };
migrate().catch(() => {}).then(draw);
</script>
</body>
</html>
