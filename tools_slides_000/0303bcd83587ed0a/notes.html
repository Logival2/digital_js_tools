<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Notes · Slides + live web</title>
<!-- Fenêtre de notes : suit le diaporama de index.html (même navigateur) par un BroadcastChannel -->
<link rel="stylesheet" href="../../ui/ui_001.css" />
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* ── Barre du haut : numéro, chronomètre, heure, navigation ── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px var(--pad);
    border-bottom: 1px dashed var(--dash);
    font-family: var(--mono); font-size: var(--fs-mono);
  }
  #num { font: 28px/1 var(--title); }
  #state { text-transform: uppercase; }
  #state.on { background: var(--lime); padding: 2px 6px; }
  #timer { font-size: 20px; cursor: pointer; }
  #clock { opacity: 0.6; }
  .spacer { flex: 1; }
  header button {
    height: 26px; min-width: 26px; padding: 0 8px;
    font-family: var(--mono); font-size: var(--fs-mono);
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--button); cursor: pointer;
  }
  header button.go { background: var(--lime); border-color: var(--lime); font-size: 16px; }

  /* ── Corps : les notes à gauche, la slide en cours et la suivante à droite ── */
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--pad);
    padding: var(--pad); min-height: 0;
  }
  textarea {
    width: 100%; height: 100%; box-sizing: border-box; resize: none;
    padding: 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; outline: none;
    font-family: var(--sans); font-size: var(--notes, 22px); line-height: 1.35; color: var(--text);
  }
  aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  aside h2 { margin: 0 0 4px; font-family: var(--mono); font-size: var(--fs-small); font-weight: normal; text-transform: uppercase; }
  .thumb {
    aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: var(--radius);
    background: #000; color: #fff; overflow: hidden; position: relative;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 0;
  }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .thumb.img { background: #fff; }
  .thumb .lbl { position: relative; padding: 8px; font-family: var(--mono); font-size: var(--fs-mono); }
  .thumb .tag { position: absolute; top: 8px; left: 8px; padding: 2px 6px; background: var(--lime); color: #000; font-family: var(--mono); font-size: var(--fs-small); text-transform: uppercase; }
  #next { opacity: 0.75; }
  .title { font-family: var(--mono); font-size: var(--fs-mono); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .size { display: flex; gap: 4px; margin-top: auto; font-family: var(--mono); font-size: var(--fs-small); align-items: center; }
  .size button { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--button); cursor: pointer; font-family: var(--mono); }
  #wait { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <span id="num">–</span>
  <span id="state">Not presenting</span>
  <span id="timer" title="Click to reset">00:00</span>
  <span id="clock"></span>
  <span class="spacer"></span>
  <button id="prev" type="button" class="go" aria-label="Previous slide">‹</button>
  <button id="next_" type="button" class="go" aria-label="Next slide">›</button>
</header>

<main id="body">
  <p id="wait">Waiting for the deck: keep its page open</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const bc = new BroadcastChannel("slides.notes");
let st = null;          // le dernier état reçu du diaporama
let shownIdx = -1;      // la slide dont les notes sont dans la zone de texte
let t0 = null;          // départ du chronomètre (première présentation)

// ── Le corps, construit à la première réception ──
function build() {
  $("body").innerHTML = `
    <textarea id="notes" spellcheck="true" placeholder="Notes for this slide…"></textarea>
    <aside>
      <div><h2>Now</h2><div id="now" class="thumb"></div><div id="nowTitle" class="title"></div></div>
      <div><h2>Next</h2><div id="next" class="thumb"></div><div id="nextTitle" class="title"></div></div>
      <div class="size">Text <button id="smaller" type="button">A−</button><button id="bigger" type="button">A+</button></div>
    </aside>`;
  $("notes").addEventListener("input", () => bc.postMessage({ t: "notes", i: shownIdx, text: $("notes").value }));
  const size = (d) => {
    const v = Math.max(12, Math.min(48, (Number(localStorage.getItem("slides.notesSize")) || 22) + d));
    localStorage.setItem("slides.notesSize", v);
    document.body.style.setProperty("--notes", v + "px");
  };
  $("smaller").onclick = () => size(-2);
  $("bigger").onclick = () => size(2);
  size(0);
}

function thumb(el, s) {
  el.className = "thumb" + (s && s.type === "img" ? " img" : "");
  el.replaceChildren();
  if (!s) return;
  if (s.type === "img") { const i = new Image(); i.src = s.src; el.append(i); }
  else if (s.type === "video") {
    const v = document.createElement("video"); v.src = s.src; v.muted = true; v.preload = "metadata";
    el.append(v, Object.assign(document.createElement("span"), { className: "tag", textContent: "Video" }));
  } else {
    el.append(Object.assign(document.createElement("span"), { className: "tag", textContent: "Live" }),
              Object.assign(document.createElement("span"), { className: "lbl", textContent: s.title }));
  }
}

bc.onmessage = ({ data: m }) => {
  if (m.t !== "state") return;
  const prev = st;
  st = m;
  if (!$("notes")) build();
  const n = st.slides.length;
  const s = st.slides[st.cur], nx = st.slides[st.cur + 1];
  $("num").textContent = n ? `${String(st.cur + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}` : "–";
  $("state").textContent = st.presenting ? "Presenting" : "Not presenting";
  $("state").classList.toggle("on", st.presenting);
  if (st.presenting && t0 === null) t0 = Date.now();
  // on ne redessine les vignettes que si elles changent (pas de clignotement des vidéos)
  const sig = (x) => x ? x.type + x.src + x.title : "";
  if (!prev || sig(prev.slides[prev.cur]) !== sig(s)) { thumb($("now"), s); $("nowTitle").textContent = s ? s.title : ""; }
  if (!prev || sig(prev.slides[prev.cur + 1]) !== sig(nx)) { thumb($("next"), nx); $("nextTitle").textContent = nx ? nx.title : "End"; }
  // les notes : remplacées en changeant de slide, jamais pendant qu'on écrit
  const ta = $("notes");
  if (st.cur !== shownIdx || document.activeElement !== ta) { ta.value = s ? s.notes : ""; shownIdx = st.cur; }
  ta.disabled = !s;
};
bc.postMessage({ t: "hello" });

// ── Navigation : boutons et clavier (hors zone de texte) ──
const go = (d) => { if (st) bc.postMessage({ t: "go", i: st.cur + d }); };
$("prev").onclick = () => go(-1);
$("next_").onclick = () => go(1);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (["ArrowRight", "ArrowDown", " ", "PageDown"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
});

// ── Chronomètre (depuis le début de la présentation, clic = remise à zéro) et heure ──
const mmss = (ms) => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
$("timer").onclick = () => { t0 = st && st.presenting ? Date.now() : null; };
setInterval(() => {
  $("timer").textContent = t0 === null ? "00:00" : mmss(Date.now() - t0);
  $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}, 500);
</script>
</body>
</html>
