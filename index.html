<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital JS tools</title>
<!-- même interface que les outils : verre gris, Helvetica en capitales, titre en MingLiU -->
<link rel="stylesheet" href="ui/ui_000.css" />
<script defer src="ui/ui_000.js"></script>
<style>
  /* page qui défile, en colonne (ui_000.css fige l'écran pour les outils) */
  html, body { height: auto; min-height: 100%; overflow: auto; }
  body {
    min-height: 100vh;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
  }

  /* en-tête : la même plaque de verre que le panneau des outils */
  #top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 12px 24px;
    padding: var(--pad);
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
    border-radius: var(--radius-panel);
  }
  #top .eyebrow { grid-column: 1 / -1; }
  #top .toolTitle { margin: 0; max-width: 820px; }
  #top nav {
    display: flex;
    gap: 16px;
    font-size: var(--fs-small);
    letter-spacing: 0.02em;
  }
  #top nav a { color: inherit; text-underline-offset: 3px; }

  /* rubrique : un titre sur sa propre plaque de verre, comme une section du panneau */
  .groupTitle {
    margin: 14px 0 0;
    padding: 8px var(--pad);
    font-size: var(--fs-text);
    font-weight: 400;
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
    border-radius: var(--radius-panel);
  }

  /* outils : une plaque de verre par outil, aperçu au format A4 */
  .toolGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .tool {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: var(--pad);
    color: inherit;
    text-decoration: none;
    background: var(--glass);
    -webkit-backdrop-filter: blur(var(--blur));
    backdrop-filter: blur(var(--blur));
    border-radius: var(--radius-panel);
  }
  .tool .thumb {
    aspect-ratio: 210 / 297; /* A4, comme les affiches */
    border-radius: var(--radius);
    background: #fff center / cover no-repeat;
  }
  .tool .name { display: block; }
  .tool .folder,
  .tool .desc {
    display: block;
    font-size: var(--fs-small);
    letter-spacing: 0.02em;
  }
  /* descriptions : des phrases, en minuscules pour se lire */
  .tool .desc { margin-top: 4px; text-transform: none; }

  /* mention, comme sur les affiches */
  #note {
    margin: auto 0 0;
    padding-top: 14px;
    text-align: center;
    font-family: "MingLiU-01", serif;
    font-size: var(--fs-small);
    text-transform: none;
    letter-spacing: 0;
  }
</style>
</head>
<body>

<header id="top">
  <p class="eyebrow"><span>Valentin Maynadié</span></p>
  <h1 class="toolTitle">Digital tools</h1>
  <nav>
    <a href="https://valentinmaynadie.com/">Back to the website</a>
    <a href="https://github.com/Logival2/digital_js_tools">GitHub</a>
  </nav>
</header>

<main>
  <div class="toolGrid" id="tools"></div>
  <!-- Pipeline : les outils de préparation et de publication (convertir, monter, publier) -->
  <h2 class="groupTitle">Pipeline</h2>
  <div class="toolGrid" id="pipeline"></div>
</main>

<footer id="note">[For experimental purposes only]</footer>

<script>
// Pour ajouter un outil : une ligne de plus dans TOOLS (outils de création) ou PIPELINE
// (préparation et publication) — dossier = nom du dossier dans le dépôt,
// apercu = une image dans le dossier apercu/, facultative.
const TOOLS = [
  {
    dossier: "tools_Matrice_images_000",
    nom: "Image matrix",
    desc: "An image viewer in WebGL: your images as an endless 2D index, a 3D sphere, a 3D space, or pinned over the Mont Blanc massif.",
    apercu: "apercu/tools_Matrice_images_000.png",
  },
  {
    dossier: "tools_flyer_000",
    nom: "Type flyer",
    desc: "Event flyer in MingLiU: a title stretched from margin to margin, a time and an address, PNG export.",
    apercu: "apercu/tools_flyer_000.png",
  },
  {
    dossier: "tools_DA_cercle_002",
    nom: "Card ring",
    desc: "Nordway poster: title, gradient and a spinning ring of cards, driven by your hand through the webcam.",
    apercu: "apercu/tools_DA_cercle_002.png",
  },
  {
    dossier: "tools_vibe_002",
    nom: "Organic type",
    desc: "The text is the seed: an organic matter grows around the letters.",
    apercu: "apercu/tools_vibe_002.png",
  },
  {
    dossier: "tools_3D_kinetic_typo_001",
    nom: "3D kinetic type",
    desc: "Text wraps around 3D shapes (stairs, cylinder, helix…) that move in a loop, with image and video export.",
    apercu: "apercu/tools_3D_kinetic_typo_001.png",
  },
  {
    dossier: "tools_gradient_body_001",
    nom: "Gradient body",
    desc: "Full screen: the webcam cuts out your silhouette (MediaPipe), which leaves a grainy glacier-blue aura, with tags on the tracked blobs.",
    apercu: "apercu/tools_gradient_body_001.jpg",
  },
];

const PIPELINE = [
  {
    dossier: "tools_heif_000",
    nom: "HEIF to JPEG",
    desc: "Converts iPhone HEIC / HEIF photos to JPEG in the browser, several at once, all exported in one ZIP.",
    apercu: "apercu/tools_heif_000.png",
  },
  {
    dossier: "tools_montage_001",
    nom: "Montage",
    desc: "One video in the background, one in a central frame, in sync: PNG or MP4 export in Instagram formats.",
    apercu: "apercu/tools_montage_001.png",
  },
  {
    dossier: "tools_favoris_001",
    nom: "Bookmarks → Resources",
    desc: "Drop your Firefox bookmarks export: two folders become ressources.json, sent to the repository for the Resources page.",
    apercu: "apercu/tools_favoris_001.png",
  },
];

for (const [listId, entries] of [["tools", TOOLS], ["pipeline", PIPELINE]]) {
  const list = document.getElementById(listId);
  for (const t of entries) list.appendChild(toolCard(t));
}
function toolCard(t) {
  const a = document.createElement("a");
  a.className = "tool";
  a.href = t.dossier + "/";
  a.innerHTML = `
    <div class="thumb"></div>
    <div class="info">
      <span class="name"></span>
      <span class="folder"></span>
      <span class="desc"></span>
    </div>`;
  if (t.apercu) a.querySelector(".thumb").style.backgroundImage = `url("${t.apercu}")`;
  a.querySelector(".name").textContent = t.nom;
  a.querySelector(".folder").textContent = t.dossier;
  a.querySelector(".desc").textContent = t.desc;
  return a;
}
</script>
</body>
</html>
